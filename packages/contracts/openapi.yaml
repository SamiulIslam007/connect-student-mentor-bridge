        application_note:
          type: string
          maxLength: 1000
          description: Required for an APPLICATION_ONLY mentor.
    Request:
      type: object
      additionalProperties: false
      required: [id, status, interaction_type, timeframe, question, context_summary, target_outcome, application_note, decision_note, student_profile_id, mentor_profile_id, student_name, mentor_name, created_at, expires_at, decided_at, reminder_sent_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined, redirected, expired, withdrawn]
        interaction_type:
          type: string
          enum: [async_thread, one_to_one_session, group_office_hours]
        timeframe:
          type: string
          enum: [within_1_month, one_to_3_months, three_to_6_months, over_6_months]
        question:
          type: string
        context_summary:
          type: string
        target_outcome:
          type: string
        application_note:
          anyOf:
            - type: string
            - type: "null"
        decision_note:
          anyOf:
            - type: string
            - type: "null"
        student_profile_id:
          type: string
        mentor_profile_id:
          type: string
        student_name:
          type: string
        mentor_name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        decided_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        reminder_sent_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
    RequestPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Request"
        next_cursor:
          anyOf:
            - type: string
            - type: "null"
    StudentProfileRequest:
      type: object
      additionalProperties: false
      required: [goals, primary_field]
      properties:
        goals:
          type: string
          minLength: 1
        primary_field:
          type: string
          minLength: 1
          maxLength: 100
          description: A display name; an unknown name creates the field on save.
        interest_fields:
          type: array
          maxItems: 2
          items:
            type: string
            minLength: 1
            maxLength: 100
        languages:
          type: array
          items:
            type: string
        account_status:
          type: string
          description: >-
            Accepted and ignored. The account status is never assigned through a
            profile save (spec profiles/profile-bootstrap).
    MentorProfileRequest:
      type: object
      additionalProperties: false
      required: [headline, bio, expertise_summary, scope_statement, primary_field, weekly_capacity]
      properties:
        headline:
          type: string
          minLength: 1
        bio:
          type: string
          minLength: 1
        expertise_summary:
          type: string
          minLength: 1
        scope_statement:
          type: string
          minLength: 1
        primary_field:
          type: string
          minLength: 1
          maxLength: 100
        fields:
          type: array
          description: Additional fields; the primary field is submitted separately.
          items:
            type: string
            minLength: 1
            maxLength: 100
        languages:
          type: array
          items:
            type: string
        weekly_capacity:
          type: integer
          minimum: 1
          maximum: 5
          description: Proposed default maximum 5 (D-38); Sprint 7 moves it to configuration.
        access_mode:
          type: string
          enum: [OPEN, APPLICATION_ONLY]
          description: >-
            Optional. Absent leaves the stored mode alone, so an older client
            cannot unpause a mentor. PAUSED is set only by pause/resume.
        account_status:
          type: string
          description: Accepted and ignored, as on the student profile save.
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNDER_MINIMUM_AGE
            - UNAUTHENTICATED
            - EMAIL_NOT_VERIFIED
            - ACCOUNT_SUSPENDED
            - FORBIDDEN
            - ROLE_REQUIRED
            - MFA_REQUIRED
            - INVALID_VERIFICATION_LINK
            - INVALID_RESET_TOKEN
            - NOT_FOUND
            - INTERNAL_ERROR
        request_id:
          type: string
