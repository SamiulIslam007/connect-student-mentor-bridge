openapi: 3.1.0
info:
  title: connect API
  version: 0.1.0
  description: >-
    Operational endpoints are unversioned and unauthenticated by design
    (docs/api-contracts.md, SEC-INF-8). Product endpoints live under the
    versioned /v1 base path. Errors are RFC 9457 problem details.
servers: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe; reports the API process only
      security: []
      responses:
        "200":
          description: The API process is running
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [api]
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe; reports required dependency availability
      security: []
      responses:
        "200":
          description: Every checked dependency is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one checked dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /v1/auth/register:
    post:
      operationId: registerAccount
      summary: Create an account; the age gate is checked before creation
      description: >-
        The date of birth is evaluated in the request and is never stored. An
        under-18 attempt returns 422 UNDER_MINIMUM_AGE and stores only a keyed
        email hash in signup_blocks. Registration returns no session and the
        response does not reveal whether the address already exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: The verification email was queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"


  /v1/auth/verify:
    get:
      operationId: verifyEmailAddress
      summary: Verify an email address with a link token (24-hour lifetime)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The address is verified (replay is idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Email and password sign-in
      description: >-
        A wrong password and an unknown email return the same 401 problem body.
        The status is evaluated only after the password is accepted, so a 403
        never discloses whether an address exists. A 403 is EMAIL_NOT_VERIFIED
        for an unverified account, ACCOUNT_SUSPENDED for a suspended account, or
        FORBIDDEN for any other non-active state. The session token is returned
        to the backend-for-frontend only, which stores it in an httpOnly cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: >-
            A Postgres-backed session, or a second-factor challenge when the
            account has an active factor. A challenged sign-in creates no session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"


  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The session is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/auth/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      summary: Revoke every session for the acting account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every session is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/auth/forgot-password:
    post:
      operationId: requestPasswordReset
      summary: Send a reset link (30-minute lifetime)
      description: >-
        The response is identical whether or not the address has an account, and
        no email is sent for an unknown address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: The reset email was accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"


  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with a single-use reset token
      description: Every existing session is revoked when the password changes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: The password changed and all sessions were revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"


  /v1/auth/mfa/enroll:
    post:
      operationId: enrollMfa
      summary: Start TOTP enrollment for the signed-in account
      description: >-
        The account password is re-checked before a secret is created. The
        response carries the authenticator URI and the single-use backup codes
        exactly once; the factor stays inactive until a valid code is verified.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaEnrollRequest"
      responses:
        "200":
          description: The enrollment secret and backup codes, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollmentResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Verify a second-factor code
      description: >-
        Two uses. With a bearer session it confirms an enrollment. Without one it
        completes a challenged sign-in: the mfa_challenge field is the opaque
        value the sign-in returned and is single-use. A wrong code, a replayed
        challenge, and an exhausted attempt allowance are all 401. Attempts are
        limited per challenge and per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: A session token; enrollment verification rotates the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaVerifyResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/auth/mfa/disable:
    post:
      operationId: disableMfa
      summary: Remove the second factor
      description: >-
        Requires the account password. The factor and its backup codes are
        deleted, the session is rotated, and the next sign-in is single-step.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaDisableRequest"
      responses:
        "200":
          description: The factor is removed; the returned token replaces the old session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaDisableResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/auth/sign-in/provider:
    post:
      operationId: startProviderSignIn
      summary: Start a Google sign-in
      description: >-
        Returns the provider authorization URL and an opaque state_cookie the
        callback must return unaltered. 503 PROVIDER_UNAVAILABLE means this
        deployment has no Google credentials; there is no built-in fallback.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderStartRequest"
      responses:
        "200":
          description: The authorization URL to send the browser to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStartResponse"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/auth/provider/callback:
    post:
      operationId: completeProviderSignIn
      summary: Complete a Google sign-in from the callback parameters
      description: >-
        Exchanges the authorization code for a session. The provider email is
        treated as verified, an existing account is linked rather than
        duplicated, and the same account-status rules apply as the password path.
        An account with an active second factor is refused with 403 FORBIDDEN: it
        must sign in with the password so the factor cannot be bypassed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCallbackRequest"
      responses:
        "200":
          description: A session for the linked or created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/me:
    get:
      operationId: getCurrentAccount
      summary: The signed-in account's own record and profiles
      description: >-
        Returns the account record (id, display name, email, verification state,
        account status, timezone) plus the caller's own `student_profile` and
        `mentor_profile`, which are null until the owner saves one. The sign-in
        response keeps the narrower AccountSummary shape. The account is taken
        from the session token, never from a request parameter.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed-in account and its own profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/affiliations:
    post:
      operationId: claimAffiliation
      summary: Claim one institution affiliation for the calling account
      description: >-
        The subject is the session's account only; `user_id`, `nid`, and
        `passport_number` in the body are ignored. The level is decided by the
        account's verified email domain against `institution_domains`: a match is
        `level_1` / `verified` / `institutional_email`, anything else is stored
        `level_0` / `pending`. When the body names no institution, the one
        registered to the email domain is used. Idempotent per institution; a
        claim for a different institution revokes the earlier verified row.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffiliationRequest"
      responses:
        "200":
          description: The stored (or already existing) affiliation and the account's resulting level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliationClaimResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/me/roles/mentor:
    post:
      operationId: grantMentorRole
      summary: Grant the mentor role to the calling account
      description: >-
        Self-service opt-in. The account always comes from the session, so a body
        cannot grant a role to anyone else. Idempotent: a repeat returns the same
        roles and writes no second assignment or audit entry. The role alone
        grants no visibility, activation, or discoverability.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's active roles after the grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/student-profile:
    put:
      operationId: saveStudentProfile
      summary: Create or fully replace the caller's student profile
      description: >-
        Full replace: interest fields absent from the submission are removed.
        Field names are the input; an unknown name creates one field inside the
        same transaction. The user comes from the session only, and account-level
        properties in the body (including `account_status`) are ignored. Last
        write wins: there is no If-Match and no version column (D-39).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileRequest"
      responses:
        "200":
          description: The saved student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/me/mentor-profile:
    put:
      operationId: saveMentorProfile
      summary: Create or fully replace the caller's mentor profile
      description: >-
        Full replace: additional fields absent from the submission are removed.
        The primary field is separate from the additional fields. Weekly capacity
        is an integer from 1 to 5 in this change (a Proposed default, D-38).
        Account-level properties in the body are ignored. Last write wins (D-39).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorProfileRequest"
      responses:
        "200":
          description: The saved mentor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/me/sessions:
    get:
      operationId: listSessions
      summary: List the caller's own live sessions
      description: >-
        Safe metadata only: never a session token or token hash. Expired rows are
        omitted and the caller's current session is marked.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's live sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Revoke one of the caller's own sessions
      description: >-
        Idempotent: an id that is already revoked, expired, or unknown answers
        204 with no error. A session id belonging to another account answers 404
        and is left untouched. Revoking the current session is allowed; the
        caller's next request is then 401.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The session is gone
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/mentor-profile/pause:
    post:
      operationId: pauseMentorProfile
      summary: Hide the mentor from discovery without resaving the profile
      description: >-
        Sets the access mode to `PAUSED`. Idempotent. No capacity check runs in
        this change: `requests-and-capacity` (#7) adds `CAPACITY_BELOW_ACTIVE`
        here once mentorships exist.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The mentor profile with its new access mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/me/mentor-profile/resume:
    post:
      operationId: resumeMentorProfile
      summary: Clear the paused access mode
      description: >-
        Sets the body's `access_mode` (`OPEN` or `APPLICATION_ONLY`), default
        `OPEN`. Idempotent, and subject to no capacity check until #7.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorAccessModeRequest"
      responses:
        "200":
          description: The mentor profile with its new access mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/me/availability:
    get:
      operationId: getAvailability
      summary: The caller's own weekly availability for one context
      description: >-
        Windows come back ordered by weekday, then start minute, then end minute.
        The mentor context requires the mentor role; the student context requires
        only a session. The user always comes from the session.
      security:
        - bearerAuth: []
      parameters:
        - name: context
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AvailabilityContext"
      responses:
        "200":
          description: The caller's windows for that context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceAvailability
      summary: Replace the caller's availability for one context
      description: >-
        Full replace: windows absent from the body are removed, and the other
        context is untouched. Validated before any write (bounds, overlap, cap,
        IANA zone); a refused save leaves the stored set unchanged.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
      responses:
        "200":
          description: The stored windows for that context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"

  /v1/mentors:
    get:
      operationId: listMentors
      summary: The public mentor directory
      description: >-
        Public read (D-71). Only ACTIVE mentor profiles appear; a paused mentor is
        hidden from every filter, and a mentor whose slots in use reach the weekly
        capacity is listed with `access_state: full`. Ordered by mentor profile id
        and keyset-paginated. A card carries no email, account id, biography,
        availability window, or capacity number.
      security: []
      parameters:
        - name: field
          in: query
          required: false
          description: A field id; matches the primary field or an additional one.
          schema:
            type: string
            format: uuid
        - name: language
          in: query
          required: false
          description: One stored language, matched exactly and case-insensitively.
          schema:
            type: string
        - name: access_state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MentorAccessState"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` value from the previous page (a mentor profile id).
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 50. Defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: One page of the public directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorDirectoryPage"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/mentors/{id}:
    get:
      operationId: getMentorContext
      summary: A requestable mentor's small public shape
      description: >-
        Signed-in read used by the request form. Only an ACTIVE mentor profile is
        visible; a draft, pending, suspended, or removed one answers 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The mentor context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorContext"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/requests:
    post:
      operationId: createRequest
      summary: Send a structured mentorship request
      description: >-
        The sender is the session's account and must hold a student profile. The
        mentor must be ACTIVE with a verified Level 1 affiliation and not paused.
        At most one PENDING request per student/mentor pair, at most three PENDING
        per student, and slots in use (pending + accepted in the last 7 days) must
        stay under the mentor's weekly capacity. The request expires 48 hours
        after creation and a reminder is sent at 24 hours.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCreate"
      responses:
        "201":
          description: The created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"


    get:
      operationId: listRequests
      summary: The caller's own sent or received requests
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [sent, received]
            default: sent
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, declined, redirected, expired, withdrawn]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: One page of the caller's requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPage"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/requests/{id}:
    get:
      operationId: getRequest
      summary: One request, readable only by its sender or addressee
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/requests/{id}/accept:
    post:
      operationId: acceptRequest
      summary: Accept a pending request (addressee only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The accepted request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
