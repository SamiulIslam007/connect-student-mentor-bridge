openapi: 3.1.0
info:
  title: connect API
  version: 0.1.0
  description: >-
    Operational endpoints are unversioned and unauthenticated by design
    (docs/api-contracts.md, SEC-INF-8). Product endpoints live under the
    versioned /v1 base path. Errors are RFC 9457 problem details.
servers: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe; reports the API process only
      security: []
      responses:
        "200":
          description: The API process is running
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [api]
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe; reports required dependency availability
      security: []
      responses:
        "200":
          description: Every checked dependency is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one checked dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /v1/auth/register:
    post:
      operationId: registerAccount
      summary: Create an account; the age gate is checked before creation
      description: >-
        The date of birth is evaluated in the request and is never stored. An
        under-18 attempt returns 422 UNDER_MINIMUM_AGE and stores only a keyed
        email hash in signup_blocks. Registration returns no session and the
        response does not reveal whether the address already exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: The verification email was queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/auth/verify:
    get:
      operationId: verifyEmailAddress
      summary: Verify an email address with a link token (24-hour lifetime)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The address is verified (replay is idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Email and password sign-in
      description: >-
        A wrong password and an unknown email return the same 401 problem body.
        The status is evaluated only after the password is accepted, so a 403
        never discloses whether an address exists. A 403 is EMAIL_NOT_VERIFIED
        for an unverified account, ACCOUNT_SUSPENDED for a suspended account, or
        FORBIDDEN for any other non-active state. The session token is returned
        to the backend-for-frontend only, which stores it in an httpOnly cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: A Postgres-backed session was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The session is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/auth/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      summary: Revoke every session for the acting account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every session is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/auth/forgot-password:
    post:
      operationId: requestPasswordReset
      summary: Send a reset link (30-minute lifetime)
      description: >-
        The response is identical whether or not the address has an account, and
        no email is sent for an unknown address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: The reset email was accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with a single-use reset token
      description: Every existing session is revoked when the password changes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: The password changed and all sessions were revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getCurrentAccount
      summary: The signed-in account's own record and profiles
      description: >-
        Returns the account record (id, display name, email, verification state,
        account status, timezone) plus the caller's own `student_profile` and
        `mentor_profile`, which are null until the owner saves one. The sign-in
        response keeps the narrower AccountSummary shape. The account is taken
        from the session token, never from a request parameter.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed-in account and its own profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/student-profile:
    put:
      operationId: saveStudentProfile
      summary: Create or fully replace the caller's student profile
      description: >-
        Full replace: interest fields absent from the submission are removed.
        Field names are the input; an unknown name creates one field inside the
        same transaction. The user comes from the session only, and account-level
        properties in the body (including `account_status`) are ignored. Last
        write wins: there is no If-Match and no version column (D-39).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileRequest"
      responses:
        "200":
          description: The saved student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/me/mentor-profile:
    put:
      operationId: saveMentorProfile
      summary: Create or fully replace the caller's mentor profile
      description: >-
        Full replace: additional fields absent from the submission are removed.
        The primary field is separate from the additional fields. Weekly capacity
        is an integer from 1 to 5 in this change (a Proposed default, D-38).
        Account-level properties in the body are ignored. Last write wins (D-39).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorProfileRequest"
      responses:
        "200":
          description: The saved mentor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorProfile"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/fields:
    get:
      operationId: listFields
      summary: List the active field taxonomy
      description: >-
        Active fields only, sorted by display name, each as an id and a display
        name. The list is created by profile saves, never seeded, and is
        unpaginated at pilot scale (pagination is Phase 1b if the list grows).
        A retired field is omitted here while existing profile references to it
        stay readable.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The active field taxonomy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [fields]
                properties:
                  fields:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldSummary"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/deactivate:
    post:
      operationId: deactivateAccount
      summary: Deactivate the signed-in account
      description: >-
        Sets the account status to deactivated and revokes every session for the
        account, so the caller's own session fails on its next request. Signing
        in again with the correct password returns the account to active.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account is deactivated and every session is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token; used by the BFF, never by browser JavaScript.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum:
            - verification_sent
            - verified
            - deactivated
            - signed_out
            - signed_out_everywhere
            - reset_email_sent_if_account_exists
            - password_reset
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [display_name, email, password, date_of_birth]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        date_of_birth:
          type: string
          format: date
          description: Evaluated in the request only; never persisted.
        timezone:
          type: string
          default: Asia/Dhaka
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 12
          maxLength: 128
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session_token, account]
      properties:
        session_token:
          type: string
          description: Opaque bearer token for the BFF; never placed in client storage.
        account:
          $ref: "#/components/schemas/AccountSummary"
    AccountStatus:
      type: string
      description: Account lifecycle state (docs/data-model.md §4.1, lowercase API form).
      enum: [pending, active, suspended, deactivated, deletion_pending, anonymized]
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, email, email_verified, account_status, timezone]
      properties:
        id:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        timezone:
          type: string
    MeResponse:
      type: object
      additionalProperties: false
      description: >-
        The signed-in account plus its own profiles. Declared standalone rather
        than composed from AccountSummary, because AccountSummary declares
        additionalProperties false and is shared with the sign-in response.
      required: [id, display_name, email, email_verified, account_status, timezone, student_profile, mentor_profile]
      properties:
        id:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        timezone:
          type: string
        student_profile:
          description: Null until the owner saves a student profile.
          anyOf:
            - $ref: "#/components/schemas/StudentProfile"
            - type: "null"
        mentor_profile:
          description: Null until the owner saves a mentor profile.
          anyOf:
            - $ref: "#/components/schemas/MentorProfile"
            - type: "null"
    FieldSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          description: The first submitted display name for this field's normalized slug.
    StudentProfile:
      type: object
      additionalProperties: false
      required: [goals, primary_field, interest_fields, languages]
      properties:
        goals:
          type: string
        primary_field:
          $ref: "#/components/schemas/FieldSummary"
        interest_fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldSummary"
        languages:
          type: array
          items:
            type: string
            description: ISO 639-1 code, lowercased.
    MentorProfile:
      type: object
      additionalProperties: false
      required: [headline, bio, expertise_summary, scope_statement, primary_field, fields, languages, weekly_capacity]
      properties:
        headline:
          type: string
        bio:
          type: string
        expertise_summary:
          type: string
        scope_statement:
          type: string
        primary_field:
          $ref: "#/components/schemas/FieldSummary"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldSummary"
        languages:
          type: array
          items:
            type: string
        weekly_capacity:
          type: integer
          minimum: 1
          maximum: 5
    StudentProfileRequest:
      type: object
      additionalProperties: false
      required: [goals, primary_field]
      properties:
        goals:
          type: string
          minLength: 1
        primary_field:
          type: string
          minLength: 1
          maxLength: 100
          description: A display name; an unknown name creates the field on save.
        interest_fields:
          type: array
          maxItems: 2
          items:
            type: string
            minLength: 1
            maxLength: 100
        languages:
          type: array
          items:
            type: string
        account_status:
          type: string
          description: >-
            Accepted and ignored. The account status is never assigned through a
            profile save (spec profiles/profile-bootstrap).
    MentorProfileRequest:
      type: object
      additionalProperties: false
      required: [headline, bio, expertise_summary, scope_statement, primary_field, weekly_capacity]
      properties:
        headline:
          type: string
          minLength: 1
        bio:
          type: string
          minLength: 1
        expertise_summary:
          type: string
          minLength: 1
        scope_statement:
          type: string
          minLength: 1
        primary_field:
          type: string
          minLength: 1
          maxLength: 100
        fields:
          type: array
          description: Additional fields; the primary field is submitted separately.
          items:
            type: string
            minLength: 1
            maxLength: 100
        languages:
          type: array
          items:
            type: string
        weekly_capacity:
          type: integer
          minimum: 1
          maximum: 5
          description: Proposed default maximum 5 (D-38); Sprint 7 moves it to configuration.
        account_status:
          type: string
          description: Accepted and ignored, as on the student profile save.
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNDER_MINIMUM_AGE
            - UNAUTHENTICATED
            - EMAIL_NOT_VERIFIED
            - ACCOUNT_SUSPENDED
            - FORBIDDEN
            - INVALID_VERIFICATION_LINK
            - INVALID_RESET_TOKEN
            - NOT_FOUND
            - INTERNAL_ERROR
        request_id:
          type: string
