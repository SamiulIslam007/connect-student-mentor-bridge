    MentorshipCadence:
      type: string
      enum: [WEEKLY, BIWEEKLY, MONTHLY, AD_HOC]
    SessionStatus:
      type: string
      enum: [SCHEDULED, HELD, CANCELLED]
    Mentorship:
      type: object
      additionalProperties: false
      required:
        - id
