        data:
          type: array
          items:
            $ref: "#/components/schemas/ReviewQueueCase"
        next_cursor:
          type: [string, "null"]
    Outcome:
      type: object
      additionalProperties: false
      required:
        - id
        - mentorship_id
        - status
        - outcome_type
        - title
        - description
        - occurred_on
        - contribution_claimed
        - contribution_confirmed
        - evidence_tier
        - counted_basis
        - coi_declared
        - is_paid_relationship
        - mentor_decision_due_at
        - confirmed_at
        - cooling_ends_at
        - counted_at
        - withdrawn_at
        - created_at
        - student_profile_id
        - mentor_profile_id
        - field_id
        - student_name
        - mentor_name
      properties:
        id:
          type: string
        mentorship_id:
          type: string
        status:
          type: string
          enum:
            - pending_confirmation
            - confirmed
            - in_platform_review
            - counted
            - rejected
            - withdrawn
            - reversed
        outcome_type:
          type: string
          enum: [admission, internship, job_offer, skill_milestone, interview]
        title:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        occurred_on:
          type: string
          format: date
        contribution_claimed:
          type: string
          enum: [directly_enabled, helped, minor]
        contribution_confirmed:
          type: string
          nullable: true
          enum: [directly_enabled, helped, minor, null]
        evidence_tier:
          type: integer
          minimum: 0
          maximum: 2
          description: Tier 0 only in the MVP.
        counted_basis:
          type: string
          nullable: true
          enum: [mentor_confirmed, platform_decision, null]
        coi_declared:
          type: boolean
        is_paid_relationship:
          type: boolean
          description: Copied from the mentorship; always false in the MVP.
        mentor_decision_due_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        cooling_ends_at:
          type: string
          format: date-time
          nullable: true
        counted_at:
          type: string
          format: date-time
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        student_profile_id:
          type: string
        mentor_profile_id:
          type: string
        field_id:
          type: string
        student_name:
          type: string
        mentor_name:
          type: string
        decisions:
          type: array
          description: Present on the single-outcome read only.
          items:
            type: object
            additionalProperties: false
            required: [decision, reason, decided_at]
            properties:
              decision:
                type: string
                enum: [valid, invalid]
              reason:
                type: string
              decided_at:
                type: string
                format: date-time
    OutcomeCreate:
      type: object
      additionalProperties: false
      required: [mentorship_id, outcome_type, description, contribution_claimed]
      properties:
        mentorship_id:
          type: string
        outcome_type:
          type: string
          enum: [ADMISSION, INTERNSHIP, JOB_OFFER, SKILL_MILESTONE, INTERVIEW]
        title:
          type: string
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 2000
        contribution_claimed:
          $ref: "#/components/schemas/ContributionLevel"
        occurred_on:
          type: string
          format: date
    OutcomeConfirm:
      type: object
      additionalProperties: false
      properties:
        contribution_level_confirmed:
          $ref: "#/components/schemas/ContributionLevel"
        coi_declaration:
          type: object
          additionalProperties: true
          description: >-
            A declared relationship kind. Present means the outcome goes to
            platform review and no confirmation is stored, so
            contribution_level_confirmed is not required in that case.
    OutcomeDispute:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ImpactRow:
      type: object
      additionalProperties: false
      required: [field_id, field_name, outcome_type, count]
      properties:
        field_id:
          type: string
        field_name:
          type: string
        outcome_type:
          type: string
          enum: [admission, internship, job_offer, skill_milestone, interview]
        count:
          type: integer
          minimum: 0
    ImpactResponse:
      type: object
      additionalProperties: false
      required: [data, counted_outcomes]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImpactRow"
        counted_outcomes:
          type: integer
          minimum: 0
      description: >-
        Counts only. There is deliberately no score, points, tier, or ranking
        property: the numeric score stays internal until the thresholds are set.
