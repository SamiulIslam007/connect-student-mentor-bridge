      properties:
        provider:
          type: string
          enum: [google]
        code:
          type: string
        state:
          type: string
        state_cookie:
          type: string
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, created_at, updated_at, expires_at, current]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ip_address:
          type: [string, "null"]
        user_agent:
          type: [string, "null"]
        current:
          type: boolean
    SessionListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
    Role:
      type: string
      description: Canonical role values (docs/data-model.md §4.1). EMPLOYER is reserved.
      enum: [STUDENT, MENTOR, INSTITUTION_ADMIN, PLATFORM_ADMIN, EMPLOYER]
    RolesResponse:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    AccountStatus:
      type: string
      description: Account lifecycle state (docs/data-model.md §4.1, lowercase API form).
      enum: [pending, active, suspended, deactivated, deletion_pending, anonymized]
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, email, email_verified, account_status, timezone]
      properties:
        id:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        timezone:
          type: string
    MeResponse:
      type: object
      additionalProperties: false
      description: >-
        The signed-in account plus its own profiles. Declared standalone rather
        than composed from AccountSummary, because AccountSummary declares
        additionalProperties false and is shared with the sign-in response.
      required: [id, display_name, email, email_verified, account_status, timezone, mfa_enabled, roles, affiliations, student_profile, mentor_profile]
      properties:
        id:
          type: string
        display_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        timezone:
          type: string
        mfa_enabled:
          type: boolean
          description: >-
            True when a verified second factor is active, so the next password
            sign-in asks for a code. The sign-in response does not carry it.
        roles:
          type: array
          description: >-
            The caller's own active roles in declaration order. Never another
            account's roles, and never trusted from a token.
          items:
            $ref: "#/components/schemas/Role"
        affiliations:
          type: array
          description: >-
            The caller's own affiliation rows, newest first, including revoked
            history. Never another account's rows.
          items:
            $ref: "#/components/schemas/Affiliation"
        student_profile:
          description: Null until the owner saves a student profile.
          anyOf:
            - $ref: "#/components/schemas/StudentProfile"
            - type: "null"
        mentor_profile:
          description: Null until the owner saves a mentor profile.
          anyOf:
            - $ref: "#/components/schemas/MentorProfile"
            - type: "null"
    FieldSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          description: The first submitted display name for this field's normalized slug.
    StudentProfile:
      type: object
      additionalProperties: false
      required: [goals, primary_field, interest_fields, languages]
      properties:
        goals:
          type: string
        primary_field:
          $ref: "#/components/schemas/FieldSummary"
        interest_fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldSummary"
        languages:
          type: array
          items:
            type: string
            description: >-
              Mentoring language, lowercased. The code format is not validated in
              this change.
    MentorAccessMode:
      type: string
      description: >-
        OPEN and APPLICATION_ONLY are chosen on the profile save; PAUSED is set
        by pause and cleared by resume.
      enum: [OPEN, APPLICATION_ONLY, PAUSED]
    MentorAccessModeRequest:
      type: object
      additionalProperties: false
      properties:
        access_mode:
          type: string
          enum: [OPEN, APPLICATION_ONLY]
    AvailabilityContext:
      type: string
      enum: [STUDENT, MENTOR]
    AvailabilityWindow:
      type: object
      additionalProperties: false
      required: [id, context, weekday, start_minute, end_minute, timezone]
      properties:
        id:
          type: string
          format: uuid
        context:
          $ref: "#/components/schemas/AvailabilityContext"
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 is Monday.
        start_minute:
          type: integer
          minimum: 0
          maximum: 1440
          description: Wall-clock minute in the window's own zone.
        end_minute:
          type: integer
          minimum: 1
          maximum: 1440
          description: Strictly after start_minute.
        timezone:
          type: string
          description: IANA zone, for example Asia/Dhaka.
    AvailabilityResponse:
      type: object
      additionalProperties: false
      required: [context, windows]
      properties:
        context:
          $ref: "#/components/schemas/AvailabilityContext"
        windows:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityWindow"
    AvailabilityRequest:
      type: object
      additionalProperties: false
      required: [context, windows]
      properties:
        context:
          $ref: "#/components/schemas/AvailabilityContext"
        windows:
          type: array
          maxItems: 21
          description: At most 21 per context (Proposed default); a full replace.
          items:
            type: object
            additionalProperties: false
            required: [weekday, start_minute, end_minute, timezone]
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
              start_minute:
                type: integer
                minimum: 0
                maximum: 1440
              end_minute:
                type: integer
                minimum: 1
                maximum: 1440
              timezone:
                type: string
    MentorProfile:
      type: object
      additionalProperties: false
      required: [headline, bio, expertise_summary, scope_statement, primary_field, fields, languages, weekly_capacity, access_mode, status, onboarding_status]
      properties:
        headline:
          type: string
        bio:
          type: string
        expertise_summary:
          type: string
        scope_statement:
          type: string
        primary_field:
          $ref: "#/components/schemas/FieldSummary"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldSummary"
        languages:
          type: array
          items:
            type: string
        weekly_capacity:
          type: integer
          minimum: 1
          maximum: 5
        access_mode:
          $ref: "#/components/schemas/MentorAccessMode"
        status:
          type: string
          enum: [DRAFT, PENDING, ACTIVE, SUSPENDED, REMOVED]
          description: >-
            Operating status. ACTIVE requires a verified Level 1 affiliation and
            an enrolled second factor; losing either returns it to PENDING.
        onboarding_status:
          type: string
          enum: [APPLIED, EMAIL_VERIFIED, AFFILIATION_VERIFIED, EMPLOYER_CHECKED]
          description: Verification progress only, never the operating status.
    Affiliation:
      type: object
      additionalProperties: false
      required: [id, institution, kind, level, method, status, department, program, batch_year, verified_at, revoked_at]
      properties:
        id:
          type: string
        institution:
          description: Null when the row names an organization instead of an institution.
          anyOf:
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id:
                  type: string
                name:
                  type: string
            - type: "null"
        kind:
          type: string
          enum: [alumnus, student, faculty_staff, employee]
        level:
          type: string
          enum: [level_0, level_1, level_2]
        method:
          type: string
          enum: [institutional_email, admin_attestation, employer_email, professional_link]
        status:
          type: string
          enum: [pending, verified, rejected, revoked, expired]
        department:
          anyOf:
            - type: string
            - type: "null"
        program:
          anyOf:
            - type: string
            - type: "null"
        batch_year:
          anyOf:
            - type: integer
              minimum: 1900
              maximum: 2200
            - type: "null"
        verified_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        revoked_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
    AffiliationRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        institution_id:
          type: string
          format: uuid
          description: >-
            Optional. When absent, the institution registered to the account's
            verified email domain is used.
        kind:
          type: string
          enum: [alumnus, student, faculty_staff, employee]
        department:
          type: string
          maxLength: 120
        program:
          type: string
          maxLength: 120
        batch_year:
          type: integer
          minimum: 1900
          maximum: 2200
    AffiliationClaimResponse:
      type: object
      additionalProperties: false
      required: [affiliation, level]
      properties:
        affiliation:
          $ref: "#/components/schemas/Affiliation"
        level:
          type: string
          enum: [level_0, level_1, level_2]
          description: The level the claim itself supports, not an aggregate.
    MentorAccessState:
      type: string
