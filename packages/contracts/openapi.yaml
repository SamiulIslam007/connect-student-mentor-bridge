        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token; used by the BFF, never by browser JavaScript.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum:
            - verification_sent
            - verified
            - deactivated
            - signed_out
            - signed_out_everywhere
            - reset_email_sent_if_account_exists
            - password_reset
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [display_name, email, password, date_of_birth]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        date_of_birth:
          type: string
          format: date
          description: Evaluated in the request only; never persisted.
        timezone:
          type: string
          default: Asia/Dhaka
        account_status:
          type: string
          description: Accepted and ignored (no-op); the server owns account status.
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 12
          maxLength: 128
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session_token, account]
      properties:
        session_token:
          type: string
          description: Opaque bearer token for the BFF; never placed in client storage.
        account:
          $ref: "#/components/schemas/AccountSummary"
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required: [mfa_required, mfa_challenge]
      properties:
        mfa_required:
          type: boolean
        mfa_challenge:
          type: string
          description: Opaque, single-use, and valid for ten minutes.
    SignInResponse:
      oneOf:
        - $ref: "#/components/schemas/SessionResponse"
        - $ref: "#/components/schemas/MfaChallengeResponse"
    MfaEnrollRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
    MfaEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [totp_uri, backup_codes]
      properties:
        totp_uri:
          type: string
          description: otpauth URI for an authenticator application; shown once.
        backup_codes:
          type: array
          items:
            type: string
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
        mfa_challenge:
          type: string
          description: The value a challenged sign-in returned; required without a session.
        method:
          type: string
          enum: [totp, backup_code]
          default: totp
    MfaVerifyResponse:
      type: object
      additionalProperties: false
      required: [session_token, account_status]
      properties:
        session_token:
          type: string
        account_status:
