        status:
          type: string
          enum: [ACTIVE]
        primary_field:
          $ref: "#/components/schemas/FieldSummary"
    RequestCreate:
      type: object
      additionalProperties: false
      required: [mentor_id, question, context_summary, target_outcome, expected_timeframe]
      properties:
        mentor_id:
          type: string
          description: The mentor profile id taken from the shared profile link.
        question:
          type: string
          minLength: 1
          maxLength: 300
        context_summary:
          type: string
          minLength: 1
          maxLength: 2000
        target_outcome:
          type: string
          minLength: 1
          maxLength: 300
        expected_timeframe:
          type: string
          enum: [WITHIN_1_MONTH, ONE_TO_3_MONTHS, THREE_TO_6_MONTHS, OVER_6_MONTHS]
