# Keeps the default rule set and allowlists one documentation example only.
# The API contract shows a Worked example (Illustrative) request with a
# UUID-shaped Idempotency-Key, which the generic API key rule reads as a secret.
[extend]
useDefault = true

[[allowlists]]
description = "Illustrative idempotency-key example in docs/api-contracts.md, not a credential"
paths = ['''docs/api-contracts\.md''']
regexes = ['''Idempotency-Key: 2f6c0c0e-4b43-4d1f-9d7f-0d3a3f6c1111''']
