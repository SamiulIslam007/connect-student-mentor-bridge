# Local development stack (design.md D3). `docker compose up -d --build`.
# Environment values come from the repository-root `.env` (copy `.env.example`).
name: connect

x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PORT: "3001"
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://objectstore:7070
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM: ${SMTP_FROM}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  objectstore:
    # S3-compatible store for local development (design deviation: the MinIO
    # community image no longer allows anonymous pulls, see design.md D3 note).
    image: versity/versitygw:v1.10.0
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "${S3_PORT:-7070}:7070"
    volumes:
      - objectstoredata:/data
    healthcheck:
      # An unauthenticated S3 request must answer with the AccessDenied error,
      # which proves the gateway is serving HTTP (it has no health route).
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q '403 Forbidden'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.32.0
    command: ["--database", "/data/mailpit.db"]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4-debian
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First run downloads the signature database; this is not a hang.
      start_period: 300s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: runtime
    image: connect-api:local
    environment:
      <<: *api-environment
      HEALTHCHECK_PATHS: /healthz,/readyz
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    # Same image as the API, different start command (ADR-016). The image is
    # built by the `api` service; this service only references it.
    image: connect-api:local
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof node > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: runtime
    image: connect-web:local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      HEALTHCHECK_PATHS: /healthz
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  objectstoredata:
  mailpitdata:
  clamavdata:
